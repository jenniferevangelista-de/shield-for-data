[project]
name = "shield-for-data"
version = "0.1.0"
description = "Shield: a data quality teammate that works with your team in chat through Switch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.1",
  "pytz",
  "great_expectations>=1.3,<2",
  "requests>=2.31",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["shield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
